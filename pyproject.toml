[project]
name = "ra-law-db"
version = "0.3.1"
description = "Japanese chemical law screening package and published dataset"
authors = [{ name = "Ameyanagi", email = "contact@ameyanagi.com" }]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["chemical", "regulatory", "law-screening", "japan", "cas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Ameyanagi/ra-law-db"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "src/ra_law_db/data/regulatory.sqlite3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ra_law_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py312"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "twine>=7.0.0",
]
